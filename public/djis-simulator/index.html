<style>
  /* ── foopgp dark-mode palette ───────────────────────────────────────
     Source SCSS variables:
       $primary-color   : #ff8012
       $secondary-color : #2c284b
       $text-color      : #5c5c77
       $text-color-light: #8585a4
       $text-color-dark : #1e1e4b

  ─────────────────────────────────────────────────────────────────── */
  :root {
    --primary:      #ff8012;
    --primary-dk:   #d96800;
    --primary-dim:  rgba(255,128,18,.12);
    --secondary:    #2c284b;

    --bg:           #111029;   /* darker than secondary */
    --bg2:          #1a1838;   /* cards */
    --bg3:          #221f44;   /* inputs / surfaces */
    --bg4:          #2c284b;   /* exact secondary */

    --text:         #ccc9e8;   /* body text */
    --text-lt:      #8585a4;   /* light text ($text-color-light) */
    --text-bright:  #eeedf8;   /* headings */
    --text-muted:   #5c5c77;   /* muted ($text-color) */

    --border:       #312e55;
    --border-lt:    #3e3a68;

    /* chart curves */
    --c1:           #ff8012;   /* foopgp orange – curve 1 */
    --c2:           #7c6fff;   /* soft violet   – curve 2 */
    --c3:           #2ecc71;   /* green         – curve 3 */
    --stingy:       #e056a0;   /* pink/magenta  – stingynalty */
    --now-line:     #ff5252;   /* red           – "now" marker */

    --shadow:       0 4px 24px rgba(0,0,0,.45);
    --radius:       10px;
    --radius-sm:    6px;
  }

  /* ── Reset ──────────────────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 15px; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Poppins', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ─────────────────────────────────────────────────────── */
  header {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    box-shadow: 0 2px 20px rgba(0,0,0,.4);
  }
  .header-inner {
    max-width: 1360px;
    margin: 0 auto;
    padding: 1.1rem 2rem;
    display: flex;
    align-items: center;
    gap: 1.5rem;
    flex-wrap: wrap;
  }
  .brand-token {
    font-size: 1.9rem;
    font-weight: 800;
    color: var(--text-bright);
    letter-spacing: -.03em;
    line-height: 1;
    white-space: nowrap;
  }
  .brand-token .accent { color: var(--primary); }
  .brand-sep {
    width: 1px; height: 36px;
    background: var(--border-lt);
    flex-shrink: 0;
  }
  .brand-sub .title {
    font-size: .9rem;
    font-weight: 600;
    color: var(--text-bright);
  }
  .brand-sub .sub {
    font-size: .72rem;
    font-weight: 400;
    color: var(--text-lt);
    letter-spacing: .02em;
  }
  .header-formula {
    margin-left: auto;
    background: var(--bg3);
    border: 1px solid var(--border-lt);
    border-radius: var(--radius-sm);
    padding: .6rem 1.1rem;
    font-size: .76rem;
    color: var(--text-lt);
    line-height: 1.7;
  }
  .header-formula strong { color: var(--primary); font-weight: 600; }
  .header-formula em     { color: var(--stingy);  font-style: normal; font-weight: 600; }

  /* ── Language selector ───────────────────────────────────────────── */
  #lang-select {
    margin-left: auto;
    background: var(--bg3);
    border: 1.5px solid var(--border-lt);
    border-radius: var(--radius-sm);
    color: var(--text-bright);
    font-family: 'Poppins', sans-serif;
    font-size: .8rem;
    font-weight: 500;
    padding: .38rem .7rem;
    cursor: pointer;
    outline: none;
    flex-shrink: 0;
  }
  #lang-select:focus { border-color: var(--primary); }

  /* ── Orange brand stripe ─────────────────────────────────────────── */
  .stripe { height: 3px; background: linear-gradient(90deg, var(--primary) 0%, #ffb347 100%); }

  /* ── Main grid ───────────────────────────────────────────────────── */
  main {
    flex: 1;
    max-width: 1360px;
    width: 100%;
    margin: 0 auto;
    padding: 1.6rem 1.5rem 2.5rem;
    display: grid;
    grid-template-columns: 290px 1fr;  /* panel | chart */
    gap: 1.4rem;
    align-items: start;
  }

  /* ── Cards ───────────────────────────────────────────────────────── */
  .card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem 1.4rem;
    box-shadow: var(--shadow);
  }
  .card + .card { margin-top: 1.1rem; }

  .card-title {
    font-size: .68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .12em;
    color: var(--primary);
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    gap: .5rem;
  }
  .card-title::before {
    content: '';
    width: 3px; height: 13px;
    background: var(--primary);
    border-radius: 2px;
    flex-shrink: 0;
  }
  .card-title.violet { color: var(--stingy); }
  .card-title.violet::before { background: var(--stingy); }
  .card-title.teal   { color: var(--c2); }
  .card-title.teal::before   { background: var(--c2); }

  /* ── Form fields ─────────────────────────────────────────────────── */
  .field { margin-bottom: .8rem; }
  .field:last-child { margin-bottom: 0; }
  .field label {
    display: block;
    font-size: .68rem;
    font-weight: 600;
    color: var(--text-lt);
    text-transform: uppercase;
    letter-spacing: .08em;
    margin-bottom: .3rem;
  }
  .input-wrap { position: relative; }
  .input-wrap .unit {
    position: absolute;
    right: .75rem; top: 50%;
    transform: translateY(-50%);
    color: var(--text-lt);
    font-size: .82rem;
    font-weight: 600;
    pointer-events: none;
  }
  input[type="number"],
  input[type="date"] {
    width: 100%;
    background: var(--bg3);
    border: 1.5px solid var(--border-lt);
    border-radius: var(--radius-sm);
    color: var(--text-bright);
    font-family: 'Poppins', sans-serif;
    font-size: .88rem;
    font-weight: 500;
    padding: .48rem .75rem;
    outline: none;
    transition: border-color .18s, box-shadow .18s;
    -moz-appearance: textfield;
  }
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }
  input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(255,128,18,.18);
    background: var(--bg4);
  }
  input[type="date"]::-webkit-calendar-picker-indicator {
    filter: invert(.6); cursor: pointer;
  }

  /* ── Curve rows ──────────────────────────────────────────────────── */
  .curve-row {
    display: flex; align-items: center;
    gap: .5rem; margin-bottom: .5rem;
  }
  .dot {
    width: 10px; height: 10px;
    border-radius: 50%; flex-shrink: 0;
    box-shadow: 0 0 6px rgba(255,128,18,.4);
  }
  .curve-hint {
    font-size: .7rem; color: var(--text-lt);
    padding-left: 1rem; margin-bottom: .7rem;
    min-height: 1em;
  }
  .curve-hint span { font-weight: 600; }

  .btn-add {
    display: inline-flex; align-items: center; gap: .35rem;
    background: var(--primary-dim);
    color: var(--primary);
    border: 1.5px solid rgba(255,128,18,.3);
    border-radius: var(--radius-sm);
    font-family: 'Poppins', sans-serif;
    font-size: .78rem; font-weight: 600;
    padding: .38rem .85rem; cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  .btn-add:hover { background: rgba(255,128,18,.22); border-color: var(--primary); }
  .btn-remove {
    background: none; border: none;
    color: var(--border-lt); font-size: 1.1rem;
    padding: 0 .3rem; cursor: pointer;
    border-radius: 3px;
    transition: color .15s, background .15s;
  }
  .btn-remove:hover { color: var(--now-line); background: rgba(255,82,82,.12); }

  hr.sep { border: none; border-top: 1px solid var(--border); margin: .85rem 0; }

  /* ── Info rows ───────────────────────────────────────────────────── */
  .info-rows { display: flex; flex-direction: column; gap: .4rem; }
  .info-row {
    display: flex; justify-content: space-between;
    align-items: baseline; font-size: .78rem;
  }
  .info-row .lbl { color: var(--text-lt); }
  .info-row .val { font-weight: 600; color: var(--text-bright); font-size: .82rem; }
  .info-row .val.v-stingy { color: var(--stingy); }

  /* ── Rate adjustment toggle ──────────────────────────────────────── */
  .toggle-adj {
    display: flex; align-items: center;
    gap: .5rem; cursor: pointer;
    font-size: .8rem; font-weight: 500;
    color: var(--text-lt); margin-bottom: .75rem;
    user-select: none;
    transition: color .15s;
  }
  .toggle-adj:hover { color: var(--stingy); }
  .toggle-adj input[type="checkbox"] {
    width: 14px; height: 14px;
    accent-color: var(--stingy); cursor: pointer;
  }
  .adj-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .55rem; }
  #adj-fields { display: none; }
  #adj-fields.open { display: block; }
  .adj-preview {
    font-size: .72rem; color: var(--stingy);
    font-weight: 600; margin-top: .5rem; min-height: 1em;
  }

  /* ── Note box ────────────────────────────────────────────────────── */
  .note-box {
    background: var(--bg3);
    border: 1px solid var(--border-lt);
    border-left: 3px solid var(--c2);
    border-radius: var(--radius-sm);
    padding: .65rem .9rem;
    font-size: .73rem;
    color: var(--text-lt);
    line-height: 1.65;
  }
  .note-box strong { color: var(--text-bright); }
  .note-box em { color: var(--stingy); font-style: normal; font-weight: 600; }

  /* ── Chart area ──────────────────────────────────────────────────── */
  .chart-area {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.4rem 1.5rem 1.2rem;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  .chart-header {
    display: flex; justify-content: space-between;
    align-items: flex-start; flex-wrap: wrap; gap: .8rem;
  }
  .chart-title {
    font-size: 1rem; font-weight: 700;
    color: var(--text-bright);
  }
  .chart-sub { font-size: .72rem; color: var(--text-lt); margin-top: .15rem; }

  .unit-toggle {
    display: flex;
    border: 1.5px solid var(--border-lt);
    border-radius: var(--radius-sm);
    overflow: hidden; flex-shrink: 0;
  }
  .unit-toggle button {
    background: none; border: none;
    padding: .35rem .85rem;
    font-family: 'Poppins', sans-serif;
    font-size: .75rem; font-weight: 600;
    color: var(--text-lt); cursor: pointer;
    transition: background .15s, color .15s;
  }
  .unit-toggle button.active {
    background: var(--primary); color: #fff;
  }
  canvas { width: 100% !important; }

  /* ── Summary stats ───────────────────────────────────────────────── */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
    gap: .65rem;
  }
  .stat-box {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: .65rem .9rem;
  }
  .stat-label {
    font-size: .62rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: .08em;
    color: var(--text-muted); margin-bottom: .2rem;
  }
  .stat-val {
    font-size: .98rem; font-weight: 700;
    color: var(--text-bright);
  }

  /* ── Footer ──────────────────────────────────────────────────────── */
  footer {
    background: var(--bg2);
    border-top: 1px solid var(--border);
    color: var(--text-muted);
    text-align: center;
    font-size: .72rem;
    padding: .85rem;
  }
  footer a { color: var(--primary); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  /* ── Responsive ──────────────────────────────────────────────────── */
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
    /* chart first on mobile even though it is second in the DOM */
    .chart-area { order: -1; }
  }
</style>
</head>

// ═══════════════════════════════════════════════════════════════════
//  Global state
// ═══════════════════════════════════════════════════════════════════
const ORIGIN_YEAR  = 2024;
const ORIGIN_MONTH = 7;     // July 2024: first month with growth (+5‰)
const S0           = 1.005; // stingynalty value on 1 July 2024
const DEFAULT_RATE = 5;     // ‰/month

const CURVE_COLORS = ['#ff8012', '#7c6fff', '#2ecc71'];
const CURVE_FILLS  = ['rgba(255,128,18,.10)','rgba(124,111,255,.10)','rgba(46,204,113,.10)'];

const TODAY       = new Date();
const TODAY_YEAR  = TODAY.getFullYear();
const TODAY_MONTH = TODAY.getMonth() + 1;

let unit        = 'cj';
let currentLang = 'fr';
let chartInstance = null;
const curves    = [];

// ═══════════════════════════════════════════════════════════════════
//  Internationalisation
// ═══════════════════════════════════════════════════════════════════
function t(key) { return LANGS[currentLang][key] !== undefined ? LANGS[currentLang][key] : LANGS.fr[key]; }

function applyLang() {
  document.documentElement.lang = currentLang;
  document.title = t('uiTitle') + ' — foopgp';
  document.querySelectorAll('[data-i18n]').forEach(function(el) {
    el.textContent = t(el.dataset.i18n);
  });
  document.querySelectorAll('[data-i18n-html]').forEach(function(el) {
    el.innerHTML = t(el.dataset.i18nHtml).replace(/__LANG__/g, currentLang);
  });
  document.querySelectorAll('.curve-input').forEach(function(el) {
    el.placeholder = t('placeholder');
  });
}

// ═══════════════════════════════════════════════════════════════════
//  Maths
// ═══════════════════════════════════════════════════════════════════
function log2(x) { return Math.log(x) / Math.LN2; }
function mkey(y, m) { return y * 100 + m; }
function nextYM(y, m) { return m === 12 ? [y + 1, 1] : [y, m + 1]; }

function buildTimeline(endY, endM, adjOn, adjY, adjM, adjRate) {
  var months = [], stingy = [];
  var s = S0, y = ORIGIN_YEAR, m = ORIGIN_MONTH;
  while (y < endY || (y === endY && m <= endM)) {
    months.push({ year: y, month: m });
    stingy.push(s);
    var nm = nextYM(y, m);
    var ny = nm[0]; var nmo = nm[1];
    var rate = DEFAULT_RATE;
    if (adjOn && (ny > adjY || (ny === adjY && nmo >= adjM))) rate = adjRate;
    // rate=0 → ×1 (frozen) ; rate<0 → decrease ; rate>0 → increase
    var next = s * (1 + rate / 1000);
    s = next > 0.001 ? next : 0.001;
    y = ny; m = nmo;
  }
  return { months: months, stingy: stingy };
}

// ═══════════════════════════════════════════════════════════════════
//  Read UI parameters  (input type="month" → value "YYYY-MM")
// ═══════════════════════════════════════════════════════════════════
function getParams() {
  var endVal = document.getElementById('end-date').value || '';
  var parts  = endVal.split('-').map(Number);
  var adjOn  = document.getElementById('chk-adj').checked;
  var adjVal = document.getElementById('adj-date').value || '';
  var adjY = 0, adjM = 0;
  if (adjOn && adjVal) { var ap = adjVal.split('-').map(Number); adjY = ap[0]; adjM = ap[1]; }
  var r = parseFloat(document.getElementById('adj-rate').value);
  return {
    endY: parts[0], endM: parts[1],
    adjOn: adjOn, adjY: adjY, adjM: adjM,
    adjRate: isNaN(r) ? 0 : r,
  };
}

function dji(amount, s) {
  var j = log2(amount + 1) / s;
  return unit === 'cj' ? j * 100 : j;
}

// ═══════════════════════════════════════════════════════════════════
//  Chart rendering
// ═══════════════════════════════════════════════════════════════════
function buildChart() {
  var p = getParams();
  if (!p.endY || !p.endM) return;

  var L = LANGS[currentLang];
  var tl = buildTimeline(p.endY, p.endM, p.adjOn, p.adjY, p.adjM, p.adjRate);
  var months = tl.months, stingy = tl.stingy, n = months.length;

  var labels = months.map(function(d) {
    return [1,4,7,10].indexOf(d.month) >= 0
      ? L.monthsShort[d.month-1]+'\n'+d.year : '';
  });

  var nowIdx = -1;
  for (var k = 0; k < months.length; k++) {
    if (mkey(months[k].year, months[k].month) === mkey(TODAY_YEAR, TODAY_MONTH)) { nowIdx = k; break; }
  }
  var adjIdx = -1;
  if (p.adjOn && p.adjY && p.adjM) {
    for (var k = 0; k < months.length; k++) {
      if (mkey(months[k].year, months[k].month) === mkey(p.adjY, p.adjM)) { adjIdx = k; break; }
    }
  }

  var active = curves.filter(function(c){ return c.amount > 0; });

  var datasets = active.map(function(c, i) {
    return {
      label: c.amount+' €',
      data: stingy.map(function(s){ return +dji(c.amount, s).toFixed(3); }),
      borderColor: CURVE_COLORS[i%3], backgroundColor: CURVE_FILLS[i%3],
      borderWidth: 2.5, pointRadius: 0, pointHoverRadius: 5,
      fill: true, tension: 0.35, yAxisID: 'yDJI',
    };
  });

  datasets.push({
    label: 'stingynalty',
    data: stingy.map(function(s){ return +s.toFixed(8); }),
    borderColor: 'rgba(224,86,160,.65)', backgroundColor: 'transparent',
    borderWidth: 1.5, borderDash: [5,4], pointRadius: 0,
    fill: false, tension: 0.3, yAxisID: 'yStingy',
  });

  var vlines = {
    id: 'vlines',
    afterDraw: function(chart) {
      var ctx = chart.ctx, xs = chart.scales.x, ys = chart.scales.yDJI;
      function draw(idx, color, dash, lbl) {
        if (idx < 0 || idx >= n) return;
        var x = xs.getPixelForValue(idx);
        ctx.save();
        ctx.setLineDash(dash); ctx.strokeStyle = color; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(x, ys.top); ctx.lineTo(x, ys.bottom); ctx.stroke();
        if (lbl) {
          ctx.setLineDash([]); ctx.fillStyle = color;
          ctx.font = '600 10px Poppins,sans-serif'; ctx.textAlign = 'center';
          ctx.fillText(lbl, x, ys.top+13);
        }
        ctx.restore();
      }
      if (nowIdx >= 0) draw(nowIdx, '#ff5252', [3,3], '▼');
      if (adjIdx >= 0) draw(adjIdx, 'rgba(224,86,160,.8)', [6,3], '⟳');
    }
  };

  var dp = unit === 'cj' ? 2 : 4;
  var gc = 'rgba(255,255,255,.05)', tc = '#5c5c77', ac = '#312e55';

  if (chartInstance) chartInstance.destroy();
  chartInstance = new Chart(document.getElementById('chart'), {
    type: 'line', data: { labels: labels, datasets: datasets }, plugins: [vlines],
    options: {
      responsive: true, interaction: { mode: 'index', intersect: false },
      animation: { duration: 250 },
      scales: {
        x: {
          ticks: { color: tc, font: { family: 'Poppins', size: 10 }, maxRotation: 0, autoSkip: false },
          grid: { color: gc }, border: { color: ac },
        },
        yDJI: {
          position: 'left', min: 0,
          title: { display: true, text: t('unitLabel')(unit), color: tc, font: { family: 'Poppins', size: 11 } },
          ticks: { color: tc, font: { family: 'Poppins', size: 10 } },
          grid: { color: gc }, border: { color: ac },
        },
        yStingy: {
          position: 'right',
          title: { display: true, text: 'stingynalty', color: 'rgba(224,86,160,.6)', font: { family: 'Poppins', size: 11 } },
          ticks: { color: 'rgba(224,86,160,.6)', font: { family: 'Poppins', size: 10 } },
          grid: { display: false }, border: { color: ac },
        },
      },
      plugins: {
        legend: {
          labels: { color: '#ccc9e8', font: { family: 'Poppins', size: 11, weight: '600' }, boxWidth: 24, boxHeight: 2, padding: 18 }
        },
        tooltip: {
          backgroundColor: '#1a1838', borderColor: '#3e3a68', borderWidth: 1,
          titleColor: '#eeedf8', bodyColor: '#8585a4',
          titleFont: { family: 'Poppins', weight: '700', size: 12 },
          bodyFont:  { family: 'Poppins', size: 11 }, padding: 10,
          callbacks: {
            title: function(items) {
              var d = months[items[0].dataIndex];
              return L.monthsFull[d.month-1]+' '+d.year;
            },
            label: function(item) {
              if (item.dataset.yAxisID === 'yStingy')
                return '  stingynalty : '+Number(item.raw).toFixed(6);
              var u = unit === 'cj' ? 'cɈ' : 'Ɉ';
              return '  '+item.dataset.label+' → '+Number(item.raw).toFixed(dp)+' '+u;
            }
          }
        }
      }
    }
  });

  // Update stingynalty info panel
  var curIdx = -1;
  for (var k = 0; k < months.length; k++) {
    if (mkey(months[k].year, months[k].month) === mkey(TODAY_YEAR, TODAY_MONTH)) { curIdx = k; break; }
  }
  document.getElementById('cur-stingy').textContent =
    curIdx >= 0 ? stingy[curIdx].toFixed(8) : '—';
  document.getElementById('end-stingy').textContent = stingy[n-1].toFixed(8);

  // Adjustment preview
  var adjDateVal = document.getElementById('adj-date').value;
  if (p.adjOn && adjDateVal && p.adjY && p.adjM) {
    var rStr = p.adjRate === 0 ? t('adjFrozen') : p.adjRate+' ‰';
    document.getElementById('adj-preview').textContent =
      t('adjPreview')(rStr, L.months[p.adjM-1], p.adjY);
  } else {
    document.getElementById('adj-preview').textContent = '';
  }

  buildStats(months, stingy, active, curIdx, n);
  updateHints(stingy, curIdx);
}

// ═══════════════════════════════════════════════════════════════════
//  Summary stats — full sentences, no stingynalty rows
// ═══════════════════════════════════════════════════════════════════
function buildStats(months, stingy, active, curIdx, n) {
  var grid = document.getElementById('stats-grid');
  grid.innerHTML = '';
  var u  = unit === 'cj' ? 'cɈ' : 'Ɉ';
  var dp = unit === 'cj' ? 1 : 3;
  var L  = LANGS[currentLang];
  var lastMonth  = months[n-1];
  var endMonName = L.months[lastMonth.month-1];
  var endYr      = lastMonth.year;

  active.forEach(function(c, i) {
    var col = CURVE_COLORS[i%3];
    if (curIdx >= 0) {
      var val = dji(c.amount, stingy[curIdx]).toFixed(dp);
      addStat(grid, t('statNow')(c.amount, val, u), col);
    }
    var valEnd = dji(c.amount, stingy[n-1]).toFixed(dp);
    addStat(grid, t('statEnd')(c.amount, valEnd, u, endMonName, endYr), col);
  });
}

function addStat(container, sentence, color) {
  var box = document.createElement('div');
  box.className = 'stat-box';
  box.innerHTML = '<div class="stat-val" style="color:'+color+';font-size:.82rem;line-height:1.5">'+sentence+'</div>';
  container.appendChild(box);
}

// ═══════════════════════════════════════════════════════════════════
//  Real-time hints below curve inputs
// ═══════════════════════════════════════════════════════════════════
function updateHints(stingy, curIdx) {
  var u  = unit === 'cj' ? 'cɈ' : 'Ɉ';
  var dp = unit === 'cj' ? 2 : 4;
  curves.forEach(function(c, i) {
    var el = document.getElementById('hint-'+i);
    if (!el) return;
    if (!c.amount || c.amount <= 0 || curIdx < 0) { el.innerHTML = ''; return; }
    var v = dji(c.amount, stingy[curIdx]);
    el.style.color = CURVE_COLORS[i%3];
    el.innerHTML = t('hintNow')(v.toFixed(dp), u);
  });
}

// ═══════════════════════════════════════════════════════════════════
//  Curve UI management
// ═══════════════════════════════════════════════════════════════════
function renderCurves() {
  var container = document.getElementById('curves-container');
  container.innerHTML = '';
  curves.forEach(function(c, i) {
    var wrap = document.createElement('div');
    wrap.innerHTML = [
      '<div class="curve-row">',
      '  <div class="dot" style="background:'+CURVE_COLORS[i%3]+';box-shadow:0 0 7px '+CURVE_COLORS[i%3]+'88"></div>',
      '  <div class="input-wrap" style="flex:1">',
      '    <input type="number" class="curve-input" id="curve-'+i+'"',
      '           value="'+(c.amount||'')+'" placeholder="'+t('placeholder')+'" min="1" step="1">',
      '    <span class="unit">€</span>',
      '  </div>',
      i > 0 ? '<button class="btn-remove" data-idx="'+i+'" title="×">×</button>' : '',
      '</div>',
      '<div class="curve-hint" id="hint-'+i+'"></div>',
    ].join('');
    container.appendChild(wrap);

    wrap.querySelector('#curve-'+i).addEventListener('input', function(e) {
      curves[i].amount = parseFloat(e.target.value) || 0;
      buildChart();
    });
    var rm = wrap.querySelector('.btn-remove');
    if (rm) rm.addEventListener('click', function() {
      curves.splice(parseInt(rm.dataset.idx), 1);
      renderCurves(); buildChart();
    });
  });
  document.getElementById('btn-add-curve').style.display =
    curves.length >= 3 ? 'none' : 'inline-flex';
}

// ═══════════════════════════════════════════════════════════════════
//  Initialisation
// ═══════════════════════════════════════════════════════════════════
function ym(date) {
  // Returns "YYYY-MM" string for input type="month"
  return date.toISOString().slice(0, 7);
}

function detectLang() {
  // 1. URL parameter: ?lang=de
  const urlLang = new URLSearchParams(window.location.search).get('lang');
  if (urlLang && ['fr','en','es','de','it','uk'].indexOf(urlLang) >= 0) return urlLang;
  // 2. Browser language
  var nav = ((navigator.language || 'fr').slice(0, 2)).toLowerCase();
  return ['fr','en','es','de','it','uk'].indexOf(nav) >= 0 ? nav : 'fr';
}

function init() {
  currentLang = detectLang();
  document.getElementById('lang-select').value = currentLang;

  curves.push({ amount: 150 });
  renderCurves();

  var def = new Date(TODAY);
  def.setFullYear(def.getFullYear() + 3);
  document.getElementById('end-date').value = ym(def);

  var adj = new Date(TODAY);
  adj.setMonth(adj.getMonth() + 6);
  document.getElementById('adj-date').value = ym(adj);

  applyLang();
  buildChart();

  document.getElementById('btn-add-curve').addEventListener('click', function() {
    if (curves.length < 3) { curves.push({ amount: 0 }); renderCurves(); buildChart(); }
  });
  document.getElementById('end-date').addEventListener('change', buildChart);
  document.getElementById('chk-adj').addEventListener('change', function(e) {
    document.getElementById('adj-fields').classList.toggle('open', e.target.checked);
    buildChart();
  });
  document.getElementById('adj-date').addEventListener('change', buildChart);
  document.getElementById('adj-rate').addEventListener('input', buildChart);
  document.querySelectorAll('.unit-toggle button').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.unit-toggle button').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      unit = btn.dataset.unit;
      buildChart();
    });
  });
  document.getElementById('lang-select').addEventListener('change', function(e) {
    currentLang = e.target.value;
    applyLang();
    renderCurves();
    buildChart();
  });
}

// init() is called by the dependency loader in <head> once Chart.js is ready.
</script>
</body>
</html>
