<!DOCTYPE html>
<html lang="$lang$">
<head>
  <meta charset="utf-8">
  <title>$title$</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="foopgp-header">
    <img class="logo" src="$logo-path$" alt="foopgp">
    <div class="meta">
      <span class="doc-title">$title$</span>
      $author$ — $date$<br>
      version $version$
    </div>
  </header>

  <h1 class="title">$title$</h1>
  $if(subtitle)$<p class="subtitle">$subtitle$</p>$endif$

$body$

  <footer class="foopgp-footer">
    Friends of OpenPGP — <a href="https://foopgp.org">foopgp.org</a> — Sortir de l'effet Cantillon, par les outils du logiciel libre.
  </footer>
</body>
</html>
