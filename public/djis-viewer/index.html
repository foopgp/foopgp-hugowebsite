<!--
  Dependencies: local first, CDN fallback.
  Probed via fetch HEAD — cross-browser reliable.
  Populate /plugins/ by running fetch-deps.sh.
-->
<script>
(function() {
  var FONT_LOCAL  = '/plugins/fonts/poppins/poppins.css';
  var FONT_CDN    = 'https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap';
  var CHART_LOCAL = '/plugins/chartjs/chart.umd.min.js';
  var CHART_CDN   = 'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js';

  function probe(url) {
    return fetch(url, { method: 'HEAD' })
      .then(function(r) { return r.ok ? url : null; })
      .catch(function()  { return null; });
  }
  function loadCSS(href) {
    var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = href;
    document.head.appendChild(l);
  }
  function loadScript(src, cb) {
    var s = document.createElement('script'); s.src = src; s.onload = cb;
    document.head.appendChild(s);
  }

  Promise.all([
    probe(FONT_LOCAL).then(function(u)  { return u || FONT_CDN;  }),
    probe(CHART_LOCAL).then(function(u) { return u || CHART_CDN; })
  ]).then(function(res) {
    loadCSS(res[0]);
    loadScript(res[1], function() {
      if (document.readyState === 'loading')
        document.addEventListener('DOMContentLoaded', init);
      else init();
    });
  });
})();
</script>
<style>
/* ── foopgp dark-mode palette (same as djis-simulator) ──────────────────────
   Source SCSS variables:
     $primary-color   : #ff8012
     $secondary-color : #2c284b
     $text-color      : #5c5c77
     $text-color-light: #8585a4
     $primary-font    : 'Poppins', sans-serif
───────────────────────────────────────────────────────────────────────────── */
:root {
  --primary:     #ff8012;
  --primary-dk:  #d96800;
  --primary-dim: rgba(255,128,18,.10);
  --secondary:   #2c284b;
  --bg:          #f8f6fb;
  --bg2:         #f0ebf5;
  --bg3:         #e8e0f0;
  --bg4:         #ddd4e8;
  --text:        #2c284b;
  --text-lt:     #5c5c77;
  --text-bright: #1a1838;
  --text-muted:  #8585a4;
  --border:      #ddd4e8;
  --border-lt:   #c8bdda;
  /* chart colors — versions assombries pour fond clair */
  --c1:          #ff8012;
  --c2:          #5d4ce6;
  --c3:          #16a34a;
  --stingy:      #b8347d;
  --now-line:    #dc2626;
  --shadow:      0 4px 16px rgba(44,40,75,.10);
  --radius:      10px;
  --radius-sm:   6px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --primary-dim: rgba(255,128,18,.12);
    --bg:          #111029;
    --bg2:         #1a1838;
    --bg3:         #221f44;
    --bg4:         #2c284b;
    --text:        #ccc9e8;
    --text-lt:     #8585a4;
    --text-bright: #eeedf8;
    --text-muted:  #5c5c77;
    --border:      #312e55;
    --border-lt:   #3e3a68;
    --c2:          #7c6fff;
    --c3:          #2ecc71;
    --stingy:      #e056a0;
    --now-line:    #ff5252;
    --shadow:      0 4px 24px rgba(0,0,0,.45);
  }
}

/* ── Reset ───────────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 18px; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Poppins', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── Header (identical structure to djis-simulator) ──────────────────────── */
/* Bandeau marque foopgp — dark systématique (override local des variables
   CSS), sticky au scrolling. Aligné sur /investir/ et /djis-simulator/. */
header {
  --bg2:         #1a1838;
  --bg3:         #221f44;
  --bg4:         #2c284b;
  --text:        #ccc9e8;
  --text-lt:     #8585a4;
  --text-bright: #eeedf8;
  --border:      #2c284b;
  --border-lt:   #3e3a68;

  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  box-shadow: 0 2px 20px rgba(0,0,0,.55);
  position: sticky;
  top: 0;
  z-index: 10;
}
.header-inner {
  max-width: 820px;
  margin: 0 auto;
  padding: 1.1rem 2rem;
  display: flex;
  align-items: center;
  gap: 1.5rem;
  flex-wrap: wrap;
}
.brand-token {
  font-size: 1.9rem;
  font-weight: 800;
  color: var(--text-bright);
  letter-spacing: -.03em;
  line-height: 1;
  white-space: nowrap;
}
.brand-token .accent { color: var(--primary); }
.brand-token img {
  display: block;
  height: 1em;
  width: auto;
  margin-top: .2em;
}
.brand-sep { width: 1px; height: 36px; background: var(--border-lt); flex-shrink: 0; }
.brand-sub .title { font-size: .9rem; font-weight: 600; color: var(--text-bright); }
.brand-sub .sub   { font-size: .72rem; color: var(--text-lt); letter-spacing: .02em; }

/* Language selector in header */
#lang-select {
  margin-left: auto;
  background: var(--bg3);
  border: 1.5px solid var(--border-lt);
  border-radius: var(--radius-sm);
  color: var(--text-bright);
  font-family: 'Poppins', sans-serif;
  font-size: .8rem; font-weight: 500;
  padding: .38rem .7rem;
  cursor: pointer; outline: none;
  flex-shrink: 0;
}
#lang-select:focus { border-color: var(--primary); }

/* Orange brand stripe */
.stripe { height: 3px; background: linear-gradient(90deg, var(--primary) 0%, #ffb347 100%); }

/* ── Main ─────────────────────────────────────────────────────────────────── */
main {
  flex: 1;
  max-width: 820px;
  width: 100%;
  margin: 0 auto;
  padding: 1.6rem 1.5rem 2.5rem;
  display: flex;
  flex-direction: column;
  gap: 1.2rem;
}

/* ── Cards ────────────────────────────────────────────────────────────────── */
.card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.4rem;
  box-shadow: var(--shadow);
}
.card-title {
  font-size: .68rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: .12em;
  color: var(--primary);
  margin-bottom: 1rem;
  display: flex; align-items: center; gap: .5rem;
}
.card-title::before {
  content: ''; width: 3px; height: 13px;
  background: var(--primary); border-radius: 2px; flex-shrink: 0;
}
.card-title.violet { color: var(--stingy); }
.card-title.violet::before { background: var(--stingy); }
.card-title.teal   { color: var(--c2); }
.card-title.teal::before   { background: var(--c2); }

/* ── Forms ────────────────────────────────────────────────────────────────── */
.form-row { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.field { flex: 1; min-width: 140px; }
.field label {
  display: block;
  font-size: .68rem; font-weight: 600;
  color: var(--text-lt);
  text-transform: uppercase; letter-spacing: .08em;
  margin-bottom: .3rem;
}
input, select, textarea {
  width: 100%;
  background: var(--bg3);
  border: 1.5px solid var(--border-lt);
  border-radius: var(--radius-sm);
  color: var(--text-bright);
  font-family: 'Poppins', sans-serif;
  font-size: .88rem; font-weight: 500;
  padding: .48rem .75rem;
  outline: none;
  transition: border-color .18s, box-shadow .18s;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(255,128,18,.18);
  background: var(--bg4);
}
input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(.6); cursor: pointer; }
textarea { min-height: 110px; resize: vertical; font-size: .8rem; }
select { cursor: pointer; }

/* ── Buttons ──────────────────────────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; gap: .4rem;
  background: linear-gradient(135deg, var(--primary-dk), var(--primary));
  border: none; border-radius: var(--radius-sm);
  color: #fff; font-family: 'Poppins', sans-serif;
  font-size: .84rem; font-weight: 600;
  padding: .52rem 1.1rem; cursor: pointer;
  transition: filter .15s;
}
.btn:hover { filter: brightness(1.12); }
.btn-tab {
  padding: .42rem 1rem;
  border: 1.5px solid var(--border-lt);
  border-radius: var(--radius-sm);
  font-family: 'Poppins', sans-serif;
  font-size: .78rem; font-weight: 600;
  cursor: pointer; transition: all .15s;
  background: none; color: var(--text-lt);
}
.btn-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn-tab:not(.active):hover { border-color: var(--primary); color: var(--primary); }
.tabs { display: flex; gap: .6rem; margin-bottom: 1rem; }

/* ── Status / result boxes ────────────────────────────────────────────────── */
.u4-box {
  background: var(--bg3); border: 1px solid var(--border-lt);
  border-radius: var(--radius-sm); padding: .9rem 1rem;
  font-size: .82rem; color: var(--primary);
  word-break: break-all; line-height: 1.6; margin-top: .9rem;
}
.u4-box .lbl { color: #ffaa44; font-weight: 600; }
.u4-box .dim { font-size: .7rem; color: var(--text-muted); margin-top: .4rem; }
.warning {
  background: rgba(255,128,18,.08); border: 1px solid rgba(255,128,18,.25);
  border-radius: var(--radius-sm); padding: .85rem 1rem;
  font-size: .82rem; line-height: 1.65; color: #ffaa44;
}
.error-box {
  background: rgba(180,40,40,.15); border: 1px solid rgba(220,80,80,.3);
  border-radius: var(--radius-sm); padding: .7rem 1rem;
  font-size: .82rem; color: #e67e73; margin-top: .8rem;
}
.info-box  { font-size: .82rem; color: var(--primary);  margin-bottom: .6rem; }
.ok-box    { font-size: .82rem; color: #58d68d;         margin-bottom: .6rem; }
.warn-box  { font-size: .82rem; color: #ffaa44;         margin-bottom: .6rem; }
.result-box {
  background: var(--bg3); border: 1px solid var(--border-lt);
  border-radius: var(--radius-sm); padding: .85rem 1rem;
  font-size: .85rem; color: #7dcea0; margin-top: .8rem; line-height: 1.6;
}
.result-box strong { color: var(--text-bright); }
.result-box .gold  { color: var(--primary); font-weight: 700; }
.result-box .dim   { font-size: .72rem; color: var(--text-muted); margin-top: .3rem; }

/* ── Table ────────────────────────────────────────────────────────────────── */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .8rem; }
th {
  padding: .55rem .75rem; text-align: left;
  color: var(--primary); font-size: .68rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: .1em;
  border-bottom: 1px solid var(--border-lt);
}
th.r { text-align: right; }
td { padding: .5rem .75rem; border-bottom: 1px solid var(--border); color: var(--text); }
td.r { text-align: right; color: #7dcea0; font-variant-numeric: tabular-nums; }
tr.total td { font-weight: 700; color: var(--text-bright); border-top: 2px solid var(--primary); }
.chip {
  display: inline-block; padding: 2px 9px;
  border-radius: 10px; font-size: .7rem; font-weight: 600;
}
.chip-yes { background: rgba(46,204,113,.18); color: #58d68d; }
.chip-no  { background: rgba(231,76,60,.18);  color: #e67e73; }
.count-lbl { float: right; color: var(--text-lt); font-weight: 400; text-transform: none; letter-spacing: 0; }

/* ── Chart ────────────────────────────────────────────────────────────────── */
.chart-wrap { margin-top: 1rem; }
canvas { width: 100% !important; }

/* ── Separator ────────────────────────────────────────────────────────────── */
hr.sep { border: none; border-top: 1px solid var(--border); margin: .85rem 0; }

/* ── Note box ─────────────────────────────────────────────────────────────── */
.note-box {
  background: var(--bg3); border: 1px solid var(--border-lt);
  border-left: 3px solid var(--c2);
  border-radius: var(--radius-sm); padding: .65rem .9rem;
  font-size: .73rem; color: var(--text-lt); line-height: 1.65;
}
.note-box strong { color: var(--text-bright); }
.note-box em { color: var(--stingy); font-style: normal; font-weight: 600; }

/* ── Footer ───────────────────────────────────────────────────────────────── */
footer {
  background: var(--bg2); border-top: 1px solid var(--border);
  color: var(--text-muted); text-align: center;
  font-size: .72rem; padding: .85rem;
}
footer a { color: var(--primary); text-decoration: none; }
input.no-second-name::placeholder {
  color: var(--now-line);
  font-style: italic;
  opacity: 1;   /* Firefox resets opacity on placeholders */
}
footer a:hover { text-decoration: underline; }

a { color: var(--primary); text-decoration: none; }
input.no-second-name::placeholder {
  color: var(--now-line);
  font-style: italic;
  opacity: 1;   /* Firefox resets opacity on placeholders */
}
a:hover { text-decoration: underline; color: #ffb347; }
.hidden { display: none; }

/* ── Unit toggle (cɈ / Ɉ) ─────────────────────────────────────────────────── */
.unit-toggle {
  display: flex;
  border: 1.5px solid var(--border-lt);
  border-radius: var(--radius-sm);
  overflow: hidden; flex-shrink: 0;
}
.unit-toggle button {
  background: none; border: none;
  padding: .32rem .75rem;
  font-family: 'Poppins', sans-serif;
  font-size: .75rem; font-weight: 600;
  color: var(--text-lt); cursor: pointer;
  transition: background .15s, color .15s;
}
.unit-toggle button.active { background: var(--primary); color: #fff; }

/* ── Responsive ───────────────────────────────────────────────────────────── */
/* Mobile : compacter le bandeau pour libérer le viewport
   (cf. retour JJB 2026-06-05). */
@media (max-width: 700px) {
  .header-inner { padding: .7rem 1rem; gap: .7rem 1rem; }
  .brand-token { font-size: 1.5rem; }
  .brand-sub .title { font-size: .85rem; }
  .brand-sub .sub   { font-size: .68rem; }
  #lang-select { font-size: .75rem; padding: .32rem .55rem; }
}
@media (max-width: 480px) {
  .brand-sep { display: none; }
  .brand-sub .sub { display: none; }
}
</style>
</head>

'use strict';

/* ══════════════════════════════════════════════════════════════════════
   Translations
══════════════════════════════════════════════════════════════════════ */
var LANGS = {
  fr: {
    pageTitle:    'Visualiseur de cotisations',

var STINGYNALTYS={"2023-05":1,"2023-06":1,"2023-07":1,"2023-08":1,"2023-09":1,"2023-10":1,"2023-11":1,"2023-12":1,"2024-01":1,"2024-02":1,"2024-03":1,"2024-04":1,"2024-05":1,"2024-06":1,"2024-07":1.005,"2024-08":1.010025,"2024-09":1.015075125,"2024-10":1.020150500625,"2024-11":1.025251253128125,"2024-12":1.030377509393766,"2025-01":1.035529396940734,"2025-02":1.040707043925438,"2025-03":1.045910579145065,"2025-04":1.051140132040791,"2025-05":1.056395832700995,"2025-06":1.061677811864500,"2025-07":1.066986200923822,"2025-08":1.072321131928441,"2025-09":1.077682737588083,"2025-10":1.083071151276024,"2025-11":1.088486507032404,"2025-12":1.093928939567566,"2026-01":1.099398584265404,"2026-02":1.104895577186731,"2026-03":1.110420055072664,"2026-04":1.115972155348028,"2026-05":1.121552016124768,"2026-06":1.127159776205392,"2026-07":1.132795575086419,"2026-08":1.138459552961851,"2026-09":1.144151850726660,"2026-10":1.149872609980293,"2026-11":1.155621973030195,"2026-12":1.161400082895346,"2027-01":1.167207083309823,"2027-02":1.173043118726372,"2027-03":1.178908334320003,"2027-04":1.184802875991604,"2027-05":1.190726890371562,"2027-06":1.196680524823419,"2027-07":1.202663927447536,"2027-08":1.208677247084774,"2027-09":1.214720633320198,"2027-10":1.220794236486799,"2027-11":1.226898207669233,"2027-12":1.233032698707579,"2028-01":1.239197862201117,"2028-02":1.245393851512123,"2028-03":1.251620820769683,"2028-04":1.257878924873532,"2028-05":1.264168319497899,"2028-06":1.270489161095389};

/* ══════════════════════════════════════════════════════════════════════
   u4 generation — per bl-pgpid algorithm
══════════════════════════════════════════════════════════════════════ */
function transliterate(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z<]/g,'');}

function generateU4(surname,givenName1,givenName2,birthDate,countryCode){
  var coords=COORDS[countryCode];
  if(!coords)return{error:'Unknown country code: '+countryCode};

  // Split on any non-letter separator FIRST, then transliterate each token.
  // This ensures "François-Xavier" → ["FRANCOIS","XAVIER"] not ["FRANCOISXAVIER"].
  function tokenize(s) {
    return s.split(/[^A-Za-z\u00C0-\u024F]+/)
            .filter(Boolean)
            .map(function(t){ return transliterate(t).toUpperCase().replace(/[^A-Z]/g,''); })
            .filter(Boolean);
  }

  // Spec udid4 §4.1.4: take only the LAST component of the surname.
  // "DE CLÉREL-DE-TOCQUEVILLE" → "TOCQUEVILLE"
  // "ROSSINI DEL MONTE PIU LUNGO DI QUARANTA" → "QUARANTA"
  var snameParts = tokenize(surname);
  var sname = snameParts.length ? snameParts[snameParts.length-1].substring(0,32) : '';
  if (!sname) return { error: 'Invalid surname (no usable characters after transliteration)' };

  // MRZ field 2 = 1st token of all given names combined
  // MRZ field 3 = 2nd token of all given names combined
  // "François-Xavier-Robert" + "Lucien" → [FRANCOIS, XAVIER, ROBERT, LUCIEN]
  //   → gn1=FRANCOIS, gn2=XAVIER
  var allGivenTokens = tokenize(givenName1 + ' ' + (givenName2||''));
  var gn1 = allGivenTokens.length > 0 ? allGivenTokens[0].substring(0,32) : '';
  var gn2 = allGivenTokens.length > 1 ? allGivenTokens[1].substring(0,32) : '';

  if (!gn1) return { error: 'Invalid given name (no usable characters after transliteration)' };

  // Hash input: SURNAME<<GN1<GN2<BIRTHDATE  (spec §4.1.4 note 1)
  var allnames = sname + '<<' + gn1 + '<' + gn2 + '<';
  var input    = allnames + birthDate;
  var hash=md5(input),b64=bytesToBase64url(hash);
  return{u4:b64.substring(0,22)+coords,allnames:allnames,input:input};
}

/* ══════════════════════════════════════════════════════════════════════
   DJI calculation — per bl-foopgp
   DJI = log₂(newEUR + prevEUR + 1) / stingynalty − prevDJI
══════════════════════════════════════════════════════════════════════ */
function calcDJI(eurAmount,prevEUR,prevDJI,dateStr){
  var ym=dateStr?dateStr.substring(0,7):'2026-04';
  var s=STINGYNALTYS[ym]||1.116;
  return Math.max(0,parseFloat((Math.log2(eurAmount+prevEUR+1)/s-prevDJI).toFixed(6)));
}

/* ══════════════════════════════════════════════════════════════════════
   Decimal normalisation: accept both comma and dot (French locale)
══════════════════════════════════════════════════════════════════════ */
function parseNum(s){ return parseFloat((s||'0').replace(/\s/g,'').replace(',','.'))||0; }

/* ══════════════════════════════════════════════════════════════════════
   Markdown table parser for contributions.md
══════════════════════════════════════════════════════════════════════ */
function parseContributions(text){
  var lines=text.trim().split('\n').filter(function(l){return l.includes('|');});
  if(lines.length<2)return[];
  var headers=lines[0].split('|').map(function(h){return h.trim();}).filter(Boolean);
  return lines.slice(2).map(function(line){
    var cells=line.split('|').map(function(c){return c.trim();}).filter(Boolean);
    var obj={};
    headers.forEach(function(h,i){obj[h]=cells[i]||'';});
    return obj;
  }).filter(function(r){return r.date;});
}

/* ══════════════════════════════════════════════════════════════════════
   Chart rendering (Chart.js)
══════════════════════════════════════════════════════════════════════ */
var contribChart = null;

function renderChart(contribs) {
  var dates  = contribs.map(function(c){ return c.date; });
  var djis   = contribs.map(function(c){ return parseNum(c.DJI); });
  var eurs   = contribs.map(function(c){ return parseNum(c.EUR); });
  var cumul  = [], sum = 0;
  djis.forEach(function(d){ sum += d; cumul.push(parseFloat(sum.toFixed(6))); });

  var gc = 'rgba(255,255,255,.05)', tc = '#5c5c77', ac = '#312e55';

  if (contribChart) contribChart.destroy();

  // Plugin: draw Ɉ and € symbols at the top of their respective axes, unrotated
  var axisSymbols = {
    id: 'axisSymbols',
    afterDraw: function(chart) {
      var ctx = chart.ctx;
      var yDJI = chart.scales.yDJI;
      var yEUR = chart.scales.yEUR;
      ctx.save();
      ctx.font = '700 13px Poppins, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      // Ɉ above left axis
      ctx.fillStyle = '#7c6fff';
      ctx.fillText('Ɉ', yDJI.left + 14, yDJI.top - 2);
      // € above right axis
      ctx.fillStyle = 'rgba(255,128,18,.85)';
      ctx.fillText('€', yEUR.right - 14, yEUR.top - 2);
      ctx.restore();
    }
  };

  contribChart = new Chart(document.getElementById('contrib-chart'), {
    type: 'bar',
    plugins: [axisSymbols],
    data: {
      labels: dates,
      datasets: [
        {
          label: t('chartDJI'),
          data: djis.map(function(v){ return v > 0 ? v : null; }),
          backgroundColor: 'rgba(124,111,255,.55)',
          borderColor:     '#7c6fff',
          borderWidth: 1.5,
          borderRadius: 3,
          minBarLength: 4,
          yAxisID: 'yDJI',
        },
        {
          label: t('chartCumul'),
          data: cumul,
          type: 'line',
          borderColor:     '#2ecc71',
          backgroundColor: 'rgba(46,204,113,.08)',
          borderWidth: 2.5,
          pointRadius: 4,
          pointBackgroundColor: '#2ecc71',
          fill: true,
          tension: 0.35,
          yAxisID: 'yDJI',
        },
        {
          label: t('chartEUR'),
          data: eurs,
          backgroundColor: 'rgba(255,128,18,.35)',
          borderColor:     '#ff8012',
          borderWidth: 1.5,
          borderRadius: 3,
          yAxisID: 'yEUR',
        },
      ]
    },
    options: {
      responsive: true,
      interaction: { mode: 'index', intersect: false },
      animation: { duration: 300 },
      scales: {
        x: {
          ticks: { color: tc, font: { family: 'Poppins', size: 10 }, maxRotation: 30 },
          grid: { color: gc }, border: { color: ac },
        },
        yDJI: {
          position: 'left', min: 0,
          title: { display: false },
          ticks: { color: '#7c6fff', font: { family: 'Poppins', size: 10 } },
          grid: { color: gc }, border: { color: ac },
        },
        yEUR: {
          position: 'right', min: 0,
          title: { display: false },
          ticks: { color: 'rgba(255,128,18,.7)', font: { family: 'Poppins', size: 10 } },
          grid: { display: false }, border: { color: ac },
        },
      },
      plugins: {
        legend: {
          labels: { color: '#ccc9e8', font: { family: 'Poppins', size: 11, weight: '600' },
                    boxWidth: 18, boxHeight: 2, padding: 14 }
        },
        tooltip: {
          backgroundColor: '#1a1838', borderColor: '#3e3a68', borderWidth: 1,
          titleColor: '#eeedf8', bodyColor: '#8585a4',
          titleFont: { family: 'Poppins', weight: '700', size: 12 },
          bodyFont:  { family: 'Poppins', size: 11 }, padding: 10,
        }
      }
    }
  });
}

/* ══════════════════════════════════════════════════════════════════════
   UI logic
══════════════════════════════════════════════════════════════════════ */
var currentU4 = '';
var djiUnit = 'cj';   // 'cj' = centi-Ɉ (default), 'j' = Ɉ

// Application state — all dynamic UI is derived from this object
// so that changing language simply calls renderDynamic() to re-render everything.
var appState = {
  fetchStatus: null,    // { type: 'loading'|'ok'|'none'|'err'|'status', extra: url|code }
  contribs:    null,    // parsed contributions array
  u4result:    null,    // { u4, input } | { error }
  simResult:   null,    // { eur, dji }
};

function djiDisplay(valJ) {
  if (djiUnit === 'cj') return (valJ * 100).toFixed(2) + ' cɈ';
  return valJ.toFixed(6) + ' Ɉ';
}

/* Populate month and year <select> elements using the current language */
function buildMonthSelects() {
  var mSel = document.getElementById('sim-month-m');
  var ySel = document.getElementById('sim-year');
  if (!mSel || !ySel) return;
  var L = LANGS[currentLang];
  var months = L.monthsFull || L.months || [];
  var savedM = mSel.value;
  mSel.innerHTML = '';
  months.forEach(function(name, idx) {
    var opt = document.createElement('option');
    opt.value = String(idx + 1).padStart(2, '0');
    opt.textContent = name;
    mSel.appendChild(opt);
  });
  if (savedM) mSel.value = savedM;
  // Year select: -2 to +5 from current year
  var now = new Date();
  var curY = now.getFullYear();
  var savedY = ySel.value;
  ySel.innerHTML = '';
  for (var y = curY - 2; y <= curY + 5; y++) {
    var opt = document.createElement('option');
    opt.value = String(y);
    opt.textContent = String(y);
    if (y === curY) opt.selected = true;
    ySel.appendChild(opt);
  }
  if (savedY) ySel.value = savedY;
  // Default month = current
  if (!savedM) mSel.value = String(now.getMonth() + 1).padStart(2, '0');
}

function renderDynamic() {
  renderFetchStatus();
  renderResultsTitle();
  buildResultsTable();
  renderSimResult();
  renderU4Result();
}

function renderFetchStatus() {
  var fs = document.getElementById('fetch-status');
  if (!fs || !appState.fetchStatus) return;
  var s = appState.fetchStatus;
  var html = '';
  if      (s.type === 'loading') html = '<div class="info-box">'  + t('loading')             + '<\/div>';
  else if (s.type === 'ok')      html = '<div class="ok-box">'    + t('fetchOk')              + '<\/div>';
  else if (s.type === 'none')    html = '<div class="warn-box">'  + t('fetchNone')            + '<\/div>';
  else if (s.type === 'err')     html = '<div class="warn-box">'  + t('fetchErr')(s.extra)    + '<\/div>';
  else if (s.type === 'status')  html = '<div class="warn-box">'  + t('fetchStatus')(s.extra) + '<\/div>';
  fs.innerHTML = html;
}

function renderResultsTitle() {
  var el = document.getElementById('results-title-el');
  if (!el || !appState.contribs) return;
  el.innerHTML = t('resultsTitle')(appState.contribs.length);
}

function renderSimResult() {
  var el = document.getElementById('sim-result');
  if (!el || !appState.simResult) return;
  var s = appState.simResult;
  el.innerHTML = '<div class="result-box">' +
    t('simResult')(s.eur, djiDisplay(s.djiJ), s.mon) + '<\/div>';
}

function renderU4Result() {
  var el = document.getElementById('u4-result');
  if (!el || !appState.u4result) return;
  var r = appState.u4result;
  if (r.error) {
    el.innerHTML = '<div class="error-box">' + r.error + '<\/div>';
  } else {
    el.innerHTML = '<div class="u4-box"><span class="lbl">u4=<\/span>' + r.u4 +
      '<div class="dim" style="margin-top:.6rem;font-size:.68rem;color:var(--text-muted);font-family:monospace">' +
      'printf &quot;' + r.mrzInput.split('<').join('&lt;') + '&quot; | md5sum | xxd -r -p | basenc --base64url' +
      '<\/div><\/div>';
  }
}

function switchMode(mode) {
  document.getElementById('mode-identity').classList.toggle('hidden', mode !== 'identity');
  document.getElementById('mode-direct').classList.toggle('hidden', mode !== 'direct');
  document.getElementById('tab-identity').classList.toggle('active', mode === 'identity');
  document.getElementById('tab-direct').classList.toggle('active', mode === 'direct');
}

/* Clear the "no second name" marker when user types in that field */
document.getElementById && (function() {
  var el = document.getElementById('givenname2');
  if (el) el.addEventListener('input', function() {
    if (this.classList.contains('no-second-name')) {
      this.classList.remove('no-second-name');
      this.placeholder = '';
    }
  });
})();

/* Auto-split hyphenated first name */
function autoSplitPrenom() {
  var el = document.getElementById('givenname1');
  var sep = el.value.search(/[- ]/);
  if (sep > 0) {
    var parts = el.value.split(/[- ]+/).filter(Boolean);
    if (parts.length >= 2) {
      el.value = parts[0];
      document.getElementById('givenname2').value = parts[1];
      document.getElementById('givenname2').focus();
    }
  }
}

function handleGenerate() {
  var s  = document.getElementById('surname').value;
  var g1 = document.getElementById('givenname1').value;
  var d  = document.getElementById('birthdate').value;
  var cc = document.getElementById('country').value;
  var g2el  = document.getElementById('givenname2');
  // If field is marked as "no second name", treat as empty regardless of value
  var g2raw = g2el.classList.contains('no-second-name') ? '' : g2el.value;

  // Check if 2nd given name has any valid chars after transliteration
  var g2valid = transliterate(g2raw).replace(/[^A-Z]/gi, '');
  if (!g2valid) {
    // No usable characters — show hint via placeholder, keep value empty
    g2el.value = '';
    g2el.placeholder = t('noSecondName');
    g2el.classList.add('no-second-name');
  } else {
    g2el.placeholder = '';
    g2el.classList.remove('no-second-name');
  }
  var g2 = g2valid ? g2raw : '';  // pass empty string to generateU4

  if (!s || !g1 || !d) {
    appState.u4result = { error: t('errRequired') };
    renderU4Result();
    return;
  }
  var result = generateU4(s, g1, g2, d, cc);
  if(result.error){
    appState.u4result = { error: result.error };
    renderU4Result();
    return;
  }
  currentU4=result.u4;
  document.getElementById('direct-u4').value=result.u4;
  appState.u4result = { u4: result.u4, mrzInput: result.input };
  renderU4Result();
  tryFetch(result.u4);
}

function handleDirectLookup() {
  var u4=document.getElementById('direct-u4').value.trim();
  if(u4.length<36){alert(t('errU4Short'));return;}
  currentU4=u4;
  tryFetch(u4);
}

async function tryFetch(u4) {
  var p2=u4.substring(0,2), p4=u4.substring(0,4);
  var filePath='by-id/u4/'+p2+'/'+p4+'/'+u4+'/contributions.md';
  var apiUrl='https://codeberg.org/api/v1/repos/foopgp/djis/contents/'+filePath+'?ref=main';
  var browseUrl='https://codeberg.org/foopgp/djis/src/branch/main/'+filePath;
  var ds=document.getElementById('data-section'), fs=document.getElementById('fetch-status');
  ds.classList.remove('hidden');
  appState.fetchStatus = { type: 'loading' }; renderFetchStatus();
  try {
    var resp=await fetch(apiUrl);
    if(resp.ok){
      var json=await resp.json(), text=atob(json.content);
      document.getElementById('contrib-text').value=text;
      appState.fetchStatus = { type: 'ok' }; renderFetchStatus();
      showContribs(parseContributions(text));
    } else if(resp.status===404){
      appState.fetchStatus = { type: 'none' }; renderFetchStatus();
      document.getElementById('results-section').classList.add('hidden');
      document.getElementById('data-section').classList.remove('hidden');
    } else {
      appState.fetchStatus = { type: 'status', extra: resp.status }; renderFetchStatus();
      document.getElementById('data-section').classList.remove('hidden');
    }
  } catch(e){
    appState.fetchStatus = { type: 'err', extra: browseUrl }; renderFetchStatus();
    document.getElementById('data-section').classList.remove('hidden');
  }
}

function handleParse() {
  var text=document.getElementById('contrib-text').value;
  if(!text.trim()){alert(t('errNoPaste'));return;}
  showContribs(parseContributions(text));
}

function buildResultsTable() {
  var contribs = appState.contribs;
  if (!contribs) return;
  var rb = document.getElementById('results-body');
  var totalEUR=0, totalDJI=0, html='';
  contribs.forEach(function(row){
    var eur=parseNum(row.EUR), dji=parseNum(row.DJI);
    totalEUR+=eur; totalDJI+=dji;
    var reg=row.registered==='yes';
    html+='<tr><td>'+row.date+'<\/td><td class="r">'+row.EUR+'<\/td>' +
      '<td class="r">'+djiDisplay(dji)+'<\/td>' +
      '<td><span class="chip '+(reg?'chip-yes':'chip-no')+'">'+(reg?t('chipYes'):t('chipNo'))+'<\/span><\/td><\/tr>';
  });
  html+='<tr class="total"><td>TOTAL<\/td><td class="r">'+totalEUR.toFixed(2)+' €<\/td>' +
    '<td class="r">'+djiDisplay(totalDJI)+'<\/td><td><\/td><\/tr>';
  rb.innerHTML=html;
}

function showContribs(contribs) {
  var rs=document.getElementById('results-section'), rb=document.getElementById('results-body');
  if(!contribs||contribs.length===0){rs.classList.add('hidden');return;}
  rs.classList.remove('hidden');
  // Show simulator card and hide data-paste card
  document.getElementById('sim-section').classList.remove('hidden');
  document.getElementById('data-section').classList.add('hidden');

  var totalEUR=0, totalDJI=0;
  contribs.forEach(function(row){ totalEUR+=parseNum(row.EUR); totalDJI+=parseNum(row.DJI); });

  appState.contribs = contribs;
  buildResultsTable();
  renderResultsTitle();
  // Pre-fill simulator totals
  document.getElementById('sim-prev-eur').value=totalEUR.toFixed(2);
  document.getElementById('sim-prev-dji').value=totalDJI.toFixed(6);
  // Default sim month = current month
  var now = new Date();
  document.getElementById('sim-month-m').value = String(now.getMonth()+1).padStart(2,'0');
  document.getElementById('sim-year').value    = String(now.getFullYear());
  // Render chart
  renderChart(contribs);
}

function handleSimulate() {
  var eur = parseNum(document.getElementById('sim-eur').value);
  var pE  = parseNum(document.getElementById('sim-prev-eur').value);
  var pD  = parseNum(document.getElementById('sim-prev-dji').value);
  var simM = document.getElementById('sim-month-m').value;
  var simY = document.getElementById('sim-year').value;
  var ym   = (simY && simM) ? simY + '-' + simM : '';
  // Build ISO date string for calcDJI (needs YYYY-MM prefix)
  var dateStr = ym ? ym + '-01' : new Date().toISOString();
  var dji = calcDJI(eur, pE, pD, dateStr);
  // Human-readable month name for display
  var monLabel = '';
  if (ym) {
    var parts = ym.split('-');
    var L = LANGS[currentLang];
    monLabel = L.monthsFull ? L.monthsFull[parseInt(parts[1])-1] + ' ' + parts[0]
                            : ym;
  }
  appState.simResult = { eur: eur.toFixed(2), djiJ: dji, mon: monLabel };
  renderSimResult();
}

/* ══════════════════════════════════════════════════════════════════════
   Initialisation (called from the dependency loader once Chart.js ready)
══════════════════════════════════════════════════════════════════════ */
function init() {
  currentLang = detectLang();
  var sel = document.getElementById('lang-select');
  sel.value = currentLang;
  sel.addEventListener('change', function(e){
    currentLang = e.target.value;
    var bd = document.getElementById('birthdate');
    if (bd) bd.lang = currentLang;
    // Rebuild month select labels in new language
    var mSel = document.getElementById('sim-month-m');
    var savedM = mSel ? mSel.value : '';
    buildMonthSelects();
    if (savedM && mSel) mSel.value = savedM;
    applyLang();
  });

  // Populate country dropdown sorted by French name
  var countryEl = document.getElementById('country');
  Object.entries(COUNTRY_NAMES)
    .sort(function(a,b){ return a[1].localeCompare(b[1],'fr'); })
    .forEach(function(entry){
      var opt = document.createElement('option');
      opt.value = entry[0]; opt.textContent = entry[1]+' ('+entry[0]+')';
      if (entry[0]==='FRA') opt.selected = true;
      countryEl.appendChild(opt);
    });

  // Populate month/year selects for the simulator
  buildMonthSelects();

  // Set initial lang on date input for locale-aware format display
  var bd = document.getElementById('birthdate');
  if (bd) bd.lang = currentLang;

  // Unit toggle (cɈ / Ɉ)
  document.querySelectorAll('#unit-toggle button').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('#unit-toggle button').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      djiUnit = btn.dataset.unit;
      buildResultsTable();
      renderSimResult();
    });
  });

  applyLang();
}
// init() is called by the dependency loader above once Chart.js has loaded.
</script>
