<!DOCTYPE html> 
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graphe Ɉ Dje Interactif</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #121212;
            color: #E4E4E4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 40px;
            margin: 0;
        }

        .container {
            background-color: #1E1E2F;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 900px;
            text-align: center;
            margin-top: 40px;
        }

        h2 {
            color: #FF7F00;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .chart-container {
            width: 100%;
            height: 450px;
            margin-bottom: 20px;
        }

        .don-input {
            background-color: #2A2A3A;
            padding: 20px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        label {
            font-size: 18px;
            font-weight: 600;
            color: #F1F1F1;
        }

        input, select {
            padding: 12px;
            border-radius: 6px;
            background-color: #3A3A5D;
            color: #E4E4E4;
            text-align: center;
            font-size: 16px;
            border: 2px solid #FF7F00;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #00FF7F;
        }

        .stingynalty-display {
            font-size: 20px;
            color: #FF7F00;
            font-weight: 600;
            margin-top: 5px;
        }

        .inputs-section {
            margin-top: 20px;
        }

        .inputs-section div {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: center;
        }

        .inputs-section select {
            flex: 1;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .chart-container {
                height: 300px;
            }

            h2 {
                font-size: 24px;
            }

            label, input, select {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Graphe Ɉ Dje Interactif</h2>
        <div class="chart-container">
            <canvas id="myChart"></canvas>
        </div>

        <div class="don-input">
            <label for="don">Montant du don (€) :</label>
            <input type="number" id="don" min="0" max="10000" step="1" placeholder="Entrez le montant du don">
            <div class="inputs-section">
                <div>
                    <label for="donMonth">Date du don :</label>
                    <select id="donMonth"></select>
                    <select id="donYear"></select>
                </div>
            </div>
            <div class="stingynalty-display" id="donStingynaltyDisplay"></div>
        </div>

        <div class="don-input">
            <label for="oldDon">Ancien don (€) :</label>
            <input type="number" id="oldDon" min="0" max="10000" step="1" placeholder="Entrez l'ancien montant du don">
            <div class="inputs-section">
                <div>
                    <label for="oldDonMonth">Date de l'ancien don :</label>
                    <select id="oldDonMonth"></select>
                    <select id="oldDonYear"></select>
                </div>
            </div>
            <div class="stingynalty-display" id="oldDonStingynaltyDisplay"></div>
        </div>
    </div>

    <script>
        const ctx = document.getElementById('myChart').getContext('2d');
        let chart;

        function populateDateSelectors() {
            const months = ['Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin', 'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'];

            ["donMonth", "oldDonMonth"].forEach(id => {
                const select = document.getElementById(id);
                months.forEach((month, index) => select.add(new Option(month, index + 1)));
            });

            ["donYear", "oldDonYear"].forEach(id => {
                const select = document.getElementById(id);
                for (let i = 2024; i <= 2030; i++) {
                    select.add(new Option(i, i));
                }
            });
        }

        function calculateStingynalty(year, month) {
            const startYear = 2024, startMonth = 6;
            if (year < startYear || (year === startYear && month < startMonth)) return 1;
            return (1 + 0.005 * ((year - startYear) * 12 + (month - startMonth))).toFixed(4);
        }

        function updateStingynaltyDisplay() {
            const donMonth = parseInt(document.getElementById("donMonth").value);
            const donYear = parseInt(document.getElementById("donYear").value);
            const oldDonMonth = parseInt(document.getElementById("oldDonMonth").value);
            const oldDonYear = parseInt(document.getElementById("oldDonYear").value);

            document.getElementById("donStingynaltyDisplay").textContent = `Stingynalty : ${calculateStingynalty(donYear, donMonth)}`;
            document.getElementById("oldDonStingynaltyDisplay").textContent = `Stingynalty : ${calculateStingynalty(oldDonYear, oldDonMonth)}`;
        }

        function generateData(donAmount, stingynalty) {
            return [1, 2, 5, 10, 20, 50, 100, 500, 1000, 5000].map(x => ({ x, y: (Math.log2(x + donAmount + 1) / stingynalty) }));
        }

        function updateChart() {
            const don = parseFloat(document.getElementById("don").value) || 0;
            const donMonth = parseInt(document.getElementById("donMonth").value);
            const donYear = parseInt(document.getElementById("donYear").value);
            const oldDon = parseFloat(document.getElementById("oldDon").value) || 0;
            const oldDonMonth = parseInt(document.getElementById("oldDonMonth").value);
            const oldDonYear = parseInt(document.getElementById("oldDonYear").value);

            // Calcul du Stingynalty pour le Don Actuel
            const donStingynalty = calculateStingynalty(donYear, donMonth);
            chart.data.datasets[0].data = generateData(don, donStingynalty);

            // Calcul du Stingynalty pour l'Ancien Don
            const oldDonStingynalty = calculateStingynalty(oldDonYear, oldDonMonth);
            chart.data.datasets[1].data = generateData(oldDon, oldDonStingynalty);

            // Fixer la plage de l'axe X pour éviter le recalcul automatique
            chart.options.scales.x.min = 1; // Plage minimum de l'axe X
            chart.options.scales.x.max = 5000; // Plage maximum de l'axe X

            // Ajouter les lignes verticales pour les dons
            const donX = don ? Math.log2(don + 1) : 1;  // Calculer la position en X du Don Actuel
            const oldDonX = oldDon ? Math.log2(oldDon + 1) : 1;  // Calculer la position en X de l'Ancien Don

            chart.options.plugins.annotation.annotations = [
                {
                    type: 'line',
                    mode: 'vertical',
                    scaleID: 'x',
                    value: donX,
                    borderColor: '#FF7F00',
                    borderWidth: 2,
                    label: {
                        content: 'Don Actuel',
                        enabled: true,
                        position: 'top'
                    }
                },
                {
                    type: 'line',
                    mode: 'vertical',
                    scaleID: 'x',
                    value: oldDonX,
                    borderColor: '#00FF7F',
                    borderWidth: 2,
                    label: {
                        content: 'Ancien Don',
                        enabled: true,
                        position: 'top'
                    }
                },
            ];

            // Ajouter un seul point pour l'intersection
            const intersectionDon = {
                x: donX,
                y: (Math.log2(donX + don + 1) / donStingynalty)
            };

            const intersectionOldDon = {
                x: oldDonX,
                y: (Math.log2(oldDonX + oldDon + 1) / oldDonStingynalty)
            };

            // Ajouter ces points comme datasets uniques
            chart.data.datasets[2] = {
                label: 'Don Actuel',
                borderColor: '#FF00FF',
                backgroundColor: '#FF00FF',
                borderWidth: 4,
                fill: false,
                data: [intersectionDon],
                showLine: false
            };

            chart.data.datasets[3] = {
                label: 'Ancien Don',
                borderColor: '#FF00FF',
                backgroundColor: '#FF00FF',
                borderWidth: 4,
                fill: false,
                data: [intersectionOldDon],
                showLine: false
            };

            chart.update();
        }

        chart = new Chart(ctx, {
            type: 'line',
            data: {
                datasets: [
                    { label: 'Don Actuel', borderColor: '#FF7F00', borderWidth: 2, fill: false, data: [] },
                    { label: 'Ancien Don', borderColor: '#00FF7F', borderWidth: 2, fill: false, data: [] },
                    // Points d'intersection ajoutés à l'initialisation mais seront redéfinis dans updateChart
                ]
            },
            options: {
                scales: {
                    x: { type: 'logarithmic', min: 1, max: 5000 },
                    y: { min: 0, max: 14 }
                },
                plugins: {
                    annotation: { annotations: [] }
                }
            }
        });

        document.querySelectorAll('input, select').forEach(el => el.addEventListener('input', () => {
            updateStingynaltyDisplay();
            updateChart();
        }));

        populateDateSelectors();
        updateChart();
    </script>
</body>
</html>
